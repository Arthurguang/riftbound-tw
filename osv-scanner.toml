# OSV-Scanner 的忽略清單。
#
# 這裡**只放「查證過、而且上游沒有修法」的漏洞**，而且每一筆都要有到期日 ——
# 到期後它會自動變回紅燈，逼我們重新看一次。沒有到期日的忽略等於永久消音。

[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
# 2027-01-06 之後這筆忽略失效，屆時重新評估（看 braces 有沒有發布 3.0.4）
ignoreUntil = 2027-01-06
reason = """
braces 的 DoS 漏洞（CVSS 8.7），經由 eslint-config-next → @next/eslint-plugin-next → fast-glob → micromatch 進來。

三件查證過的事實（2026-10-06）：
1. 這是**開發期依賴**。eslint 只跑在開發者的機器與 CI 上，不會被打包進網站，
   使用者的瀏覽器永遠不會下載到它。npm audit --omit=dev 回報 0 漏洞。
2. **上游沒有修正版**：漏洞範圍是 <=3.0.3，而 3.0.3 就是最新版（2024-09 之後未再發布），
   OSV 自己列的 FIXED VERSION 也是「--」。
3. npm 建議的修法是把 eslint-config-next 從 16 降到 14.2.35（跨兩個大版本），
   會讓整套 lint 規則倒退好幾代，而且 Next 16 專用的規則會失效 —— 代價比漏洞本身大。

所以暫時忽略，並且設到期日。真正的風險是「紅燈長期掛著 → 下次真的有事也沒人當真」。
"""
